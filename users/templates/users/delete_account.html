{% extends 'freewill/base.html' %}
{% load static %}
{% block title %}FreeWill Users - Delete Account{% endblock %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    <h2>Are you sure you want to delete your account?</h2>
    <label for="password">Enter your password to confirm deletion:</label> <!-- Password confirmation -->
    <input type="password" name="password" id="password" required>
    <button type="submit" class="btn btn-danger">Yes, Delete My Account</button>
</form>
<a href="{% url 'users:user' %}">Cancel</a> <!-- Cancel button -->
{% endblock %}
