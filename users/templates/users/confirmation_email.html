<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Confirm Email</title>
    <!--Email templates don't allow linking stylesheets-->
    <style>
    body {
        background-color: #f8e0ff;
        color: #8060a0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }
    .title {
        text-align: center;
        font-size: 1.8rem;
        color: #8060a0;
        display: block;
        width: 100%;
    }
    .app-button {
        all: unset;
        display: block;
        max-width: fit-content;
        width: 100%;
        padding: 0.75rem 1.5rem;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        text-align: center;
        color: white !important;
        background-color: #8060a0;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin: 1rem 0rem;
        text-decoration: none !important;
        border: none !important;
        outline: none !important;
    }
    .app-button:hover {
        background-color: #705090;
    }
    .app-button.full-width {
        max-width: none;
        width: 100%;
        padding: 0.75rem 0rem;
    }
    .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 2rem;
        padding-top: 2rem;
        padding-bottom: 2rem;
    }
    .card {
        background-color: #f0d0ff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        color: #8060a0;
    }
    </style>
</head>
<body class="body">
    <div class="wrapper">
        <div class="card">
            <h2 class="title">Confirm Email</h2>
            <p>Hi {{ username }},</p>
            <p>Thanks for registering! Please confirm your email address by clicking the button below:</p>
            <a href="{{ confirmation_link }}" class="app-button full-width">Confirm Email</a>
            <p>If the button doesn't work, you can also copy and paste this link into your browser:</p>
            <a href="{{ confirmation_link }}">{{ confirmation_link }}</a>
            <p>Regards,</p>
            <p>FreeWill Users</p>
        </div>
    </div>
</body>
</html>
